name: Browser documentation security checks

on:
  pull_request:
    paths: ['cs_doc.html', 'escape-html.js', 'tests/**', '.github/workflows/html-security.yml']
  push:
    branches: [main]
    paths: ['cs_doc.html', 'escape-html.js', 'tests/**', '.github/workflows/html-security.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
